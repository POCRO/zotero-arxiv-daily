zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

# Email is disabled: this deployment writes a markdown digest file to the repo instead
# (see executor.digest_dir below) and the GitHub Action commits it back. No SMTP secrets needed.
email:
  enabled: false

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: https://www.cctq.ai/v1
  api_mode: chat_completion
  generation_kwargs:
    model: gpt-6-luna
  language: Chinese

source:
  arxiv:
    # Coarse pre-filter so we don't pull in unrelated fields (physics, bio, ...).
    # The actual "what matches my interest" ranking comes from comparing against your Zotero
    # library via the reranker, not from this list. Adjust to your field:
    # https://arxiv.org/category_taxonomy
    category: ["cs.AI","cs.CV","cs.LG","cs.CL"]

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
  digest_dir: digests
