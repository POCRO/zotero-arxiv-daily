name: Daily paper digest
on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 06:00 next day in China Standard Time (UTC+8)
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  calculate-and-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
            echo "Use custom config: "
            cat config/custom.yaml
          fi
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit"
          else
            git commit -m "chore: daily paper digest $(date -u +'%Y-%m-%d') [skip ci]"
            git push
          fi
